services:
  postgres:
    image: postgres:17-alpine
    container_name: banco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banco123}
      POSTGRES_DB: ${POSTGRES_DB:-banco}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-banco} -d $${POSTGRES_DB:-banco}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - banco-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: banco-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@banco.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - '${PGADMIN_PORT:-8080}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banco-net

  redis:
    image: redis:7-alpine
    container_name: banco-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - banco-net

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  banco-net:
    driver: bridge
